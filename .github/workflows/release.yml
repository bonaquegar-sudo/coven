# Builds the desktop app (Tauri + the Python backend as a PyInstaller sidecar) for Windows, macOS and Linux
# and attaches the installers to a draft GitHub release. Trigger: push a tag like v0.2.0.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Backend sidecar
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python build_sidecar.py
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: Coven ${{ github.ref_name }}
          releaseBody: Instaladores de Coven para Windows, macOS y Linux. Ver el README para empezar.
          releaseDraft: true
